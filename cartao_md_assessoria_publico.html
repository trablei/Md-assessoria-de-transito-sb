<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>MD Assessoria ao Trânsito</title>
<style>
:root{--gold:#d7ad54;--gold2:#f2d58d;--black:#090909;--panel:#111111;--muted:#aaa49a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#242016 0%,#0b0b0b 48%,#050505 100%);color:#f8f5ee;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(100%,420px);border:1px solid rgba(215,173,84,.34);border-radius:28px;background:linear-gradient(155deg,rgba(24,24,24,.98),rgba(8,8,8,.98));padding:30px 24px 24px;box-shadow:0 24px 70px #0009;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 20% auto;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.brand{display:flex;justify-content:center;margin:0 auto 22px}
.brand img{width:176px;height:176px;object-fit:cover;border-radius:50%;box-shadow:0 0 0 1px #d7ad5444,0 14px 35px #0008}
.eyebrow{text-align:center;color:var(--gold);font-size:10px;letter-spacing:.28em;text-transform:uppercase;margin:0 0 10px;font-weight:700}
h1{text-align:center;font-size:25px;line-height:1.15;letter-spacing:.015em;margin:0;font-weight:700}
h1 span{display:block;color:var(--gold2);font-size:17px;letter-spacing:.14em;margin-top:7px}
.description{text-align:center;color:#c4c0b8;font-size:13px;line-height:1.65;max-width:290px;margin:17px auto 25px}
.actions{display:grid;gap:11px}
.action{display:flex;align-items:center;gap:13px;text-decoration:none;color:#f8f5ee;background:#171717;border:1px solid #39342a;border-radius:14px;padding:14px 16px;transition:transform .18s,border-color .18s,background .18s;cursor:pointer;font:inherit;text-align:left;width:100%}
.action:hover{transform:translateY(-2px);border-color:var(--gold);background:#1e1b15}
.action.primary{background:linear-gradient(110deg,#d9b45f,#b98a32);border-color:#e6c775;color:#100e09;font-weight:750}
.action.primary:hover{background:linear-gradient(110deg,#efcf7c,#c99a3d)}
.icon{width:37px;height:37px;display:grid;place-items:center;border-radius:11px;background:#ffffff0b;flex:0 0 auto}
.primary .icon{background:#00000012}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.copy{display:flex;flex-direction:column;gap:3px}
.copy strong{font-size:14px}
.copy small{font-size:11px;opacity:.7}
.arrow{margin-left:auto;font-size:20px;opacity:.75}
.footer{margin-top:25px;padding-top:17px;border-top:1px solid #ffffff12;text-align:center;color:#888176;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.note{margin:14px 0 0;text-align:center;color:#827b70;font-size:10px;line-height:1.5}
@media(min-width:520px){body{padding:40px}.card{padding:34px 28px 25px}}
</style>
</head>
